name: Bug report
description: Report a reproducible AirType defect without sensitive user data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real recordings, transcripts, API keys, databases, logs, or provider traces. Replace them with generated test data.

  - type: input
    id: version
    attributes:
      label: AirType version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 24H2 build 26100
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior using non-sensitive test data.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: asr
    attributes:
      label: ASR path
      options:
        - Not related to transcription
        - Local ASR
        - Gemini
        - Groq
        - OpenRouter
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed recordings, transcripts, credentials, and other sensitive data from this report.
          required: true

  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately through the process in SECURITY.md, not through this form.
