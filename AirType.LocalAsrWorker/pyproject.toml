[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "airtype-asr-worker"
version = "0.1.0"
description = "Local AirType ASR worker using faster-whisper over a localhost WebSocket protocol."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "websockets==16.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.7.1",
    "onnxruntime==1.24.4",
    "numpy==2.5.1",
    "huggingface-hub==0.36.2",
    "tokenizers==0.21.4",
    "tqdm==4.67.3",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
airtype-asr-worker = "airtype_asr_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["airtype_asr_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
