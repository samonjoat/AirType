name: Sign release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without a leading v
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sign-release
  cancel-in-progress: false

jobs:
  sign:
    name: Build and submit SignPath package
    runs-on: windows-2025
    timeout-minutes: 180
    environment: release-signing

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            AirType.LocalAsrWorker/pyproject.toml
            AirType.LocalAsrWorker/requirements-runtime.txt

      - name: Validate signing source and configuration
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'SignPath release signing must run from main.'
          }
          if ($env:AIRTYPE_RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must use x.y.z format.'
          }
          foreach ($name in @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Required SignPath configuration is missing: $name"
            }
          }

      - name: Install worker test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e ".\AirType.LocalAsrWorker[dev]"

      - name: Validate source snapshot
        shell: pwsh
        run: .\tools\build-public-snapshot.ps1

      - name: Build unsigned staging tree
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: .\tools\build-release.ps1 -Version $env:AIRTYPE_RELEASE_VERSION -KeepStaging

      - name: Upload unsigned staging tree
        id: upload-unsigned-staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirType-${{ inputs.version }}-signing-input
          path: release-artifacts/app/staging/AirType-${{ inputs.version }}-win-x64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Submit SignPath payload signing request
        id: submit-payload-signing-request
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-staging.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release-artifacts/app/signpath-returned
          parameters: |
            version: ${{ toJSON(inputs.version) }}

      - name: Finalize signed payload and installer input
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          .\tools\finalize-signpath-release.ps1 `
            -SignedArtifactDirectory .\release-artifacts\app\signpath-returned `
            -Version $env:AIRTYPE_RELEASE_VERSION `
            -ExpectedSourceCommit $env:GITHUB_SHA

      - name: Upload installer signing input
        id: upload-installer-input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirType-${{ inputs.version }}-installer-signing-input
          path: release-artifacts/app/signpath-installer-input/AirType-${{ inputs.version }}-win-x64-signing-input.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Submit SignPath installer signing request
        id: submit-installer-signing-request
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installer-input.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release-artifacts/app/signpath-installer-returned
          parameters: |
            version: ${{ toJSON(inputs.version) }}

      - name: Finalize signed Windows installer
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          .\tools\finalize-signpath-installer.ps1 `
            -SignedArtifactDirectory .\release-artifacts\app\signpath-installer-returned `
            -Version $env:AIRTYPE_RELEASE_VERSION `
            -ExpectedSourceCommit $env:GITHUB_SHA

      - name: Upload signed stable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirType-${{ inputs.version }}-win-x64-signed
          path: |
            release-artifacts/app/signed/AirType-${{ inputs.version }}-win-x64.zip
            release-artifacts/app/signed/AirType-${{ inputs.version }}-win-x64.sha256
            release-artifacts/app/signed/AirType-${{ inputs.version }}-win-x64.msi
            release-artifacts/app/signed/AirType-${{ inputs.version }}-win-x64.msi.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summarize signing result
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
          PAYLOAD_SIGNING_REQUEST_URL: ${{ steps.submit-payload-signing-request.outputs.signing-request-web-url }}
          INSTALLER_SIGNING_REQUEST_URL: ${{ steps.submit-installer-signing-request.outputs.signing-request-web-url }}
        run: |
          "## AirType $env:AIRTYPE_RELEASE_VERSION signed package" >> $env:GITHUB_STEP_SUMMARY
          "Payload SignPath request: $env:PAYLOAD_SIGNING_REQUEST_URL" >> $env:GITHUB_STEP_SUMMARY
          "Installer SignPath request: $env:INSTALLER_SIGNING_REQUEST_URL" >> $env:GITHUB_STEP_SUMMARY
          "Published as GitHub Release: no" >> $env:GITHUB_STEP_SUMMARY
