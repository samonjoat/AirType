name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and snapshot
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            AirType.LocalAsrWorker/pyproject.toml
            AirType.LocalAsrWorker/requirements-runtime.txt

      - name: Install worker test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e ".\AirType.LocalAsrWorker[dev]"

      - name: Verify DCO sign-offs
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          AIRTYPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AIRTYPE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .\tools\verify-dco.ps1 -BaseSha $env:AIRTYPE_BASE_SHA -HeadSha $env:AIRTYPE_HEAD_SHA

      - name: Restore
        shell: pwsh
        run: dotnet restore .\AirType.sln

      - name: Clean
        shell: pwsh
        run: dotnet clean .\AirType.sln --no-restore --verbosity minimal

      - name: Build
        shell: pwsh
        run: dotnet build .\AirType.sln --no-restore --verbosity minimal

      - name: Run xUnit tests
        shell: pwsh
        run: dotnet test .\AirType.Tests\AirType.Tests.csproj --no-build --verbosity minimal

      - name: Run Local ASR worker tests
        shell: pwsh
        working-directory: AirType.LocalAsrWorker
        run: python -m pytest .\tests -q

      - name: Verify notification assets
        shell: pwsh
        run: python .\tools\generate-notification-sound-candidates.py --verify-production

      - name: Build and validate public snapshot
        shell: pwsh
        run: .\tools\build-public-snapshot.ps1
