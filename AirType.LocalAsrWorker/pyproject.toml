[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airtype-asr-worker"
version = "0.1.0"
description = "Local AirType ASR worker using faster-whisper over a localhost WebSocket protocol."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "websockets==16.1.1",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.1",
    "onnxruntime==1.28.0",
    "numpy==2.4.4",
    "huggingface-hub==0.36.2",
    "tokenizers==0.23.1",
    "tqdm==4.67.3",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
airtype-asr-worker = "airtype_asr_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["airtype_asr_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
