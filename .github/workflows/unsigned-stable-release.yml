name: Prepare unsigned stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without a leading v
        required: true
        default: 1.0.0
        type: string
      include_local_asr:
        description: Build the separate Local ASR model bundle
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: unsigned-stable-release
  cancel-in-progress: false

jobs:
  package:
    name: Build explicit unsigned stable artifacts
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            AirType.LocalAsrWorker/pyproject.toml
            AirType.LocalAsrWorker/requirements-runtime.txt

      - name: Validate release input and source branch
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
          AIRTYPE_RELEASE_REF: ${{ github.ref_name }}
        run: |
          if ($env:AIRTYPE_RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must use x.y.z format.'
          }
          if ($env:AIRTYPE_RELEASE_REF -ne 'main') {
            throw 'Unsigned stable release preparation must run from main.'
          }

      - name: Install worker test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e ".\AirType.LocalAsrWorker[dev]"

      - name: Validate source snapshot
        shell: pwsh
        run: .\tools\build-public-snapshot.ps1

      - name: Build explicit unsigned application release
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          .\tools\build-release.ps1 `
            -Version $env:AIRTYPE_RELEASE_VERSION `
            -PublicRelease `
            -AllowUnsignedPublicRelease `
            -CertificateThumbprint ''

      - name: Verify unsigned installer contract
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          .\tools\verify-windows-installer.ps1 `
            -PackagePath ".\release-artifacts\app\AirType-$env:AIRTYPE_RELEASE_VERSION-win-x64-unsigned.msi" `
            -ExpectedVersion $env:AIRTYPE_RELEASE_VERSION `
            -ExpectedInstallerSignatureStatus NotSigned `
            -ExpectedPayloadSignatureStatus NotSigned `
            -ExpectedSourceCommit $env:GITHUB_SHA `
            -ExpectedSourceBranch main

      - name: Build Local ASR bundle
        if: ${{ inputs.include_local_asr }}
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: .\tools\package-local-asr-bundle.ps1 -Version $env:AIRTYPE_RELEASE_VERSION -PrepareRuntime -Force

      - name: Summarize release package
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          "## AirType $env:AIRTYPE_RELEASE_VERSION unsigned stable package" >> $env:GITHUB_STEP_SUMMARY
          "Authenticode signed: no" >> $env:GITHUB_STEP_SUMMARY
          "Package suffix: -unsigned" >> $env:GITHUB_STEP_SUMMARY
          "Expected Windows publisher: Unknown" >> $env:GITHUB_STEP_SUMMARY
          "Formats: MSI installer and portable ZIP with SHA-256 sidecars" >> $env:GITHUB_STEP_SUMMARY
          "Published as GitHub Release: no" >> $env:GITHUB_STEP_SUMMARY
          "Manual exact-package acceptance is required before publication." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload application release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirType-${{ inputs.version }}-win-x64-unsigned-stable
          path: |
            release-artifacts/app/AirType-${{ inputs.version }}-win-x64-unsigned.zip
            release-artifacts/app/AirType-${{ inputs.version }}-win-x64-unsigned.sha256
            release-artifacts/app/AirType-${{ inputs.version }}-win-x64-unsigned.msi
            release-artifacts/app/AirType-${{ inputs.version }}-win-x64-unsigned.msi.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Local ASR package
        if: ${{ inputs.include_local_asr }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirType-${{ inputs.version }}-local-asr
          path: |
            release-artifacts/local-asr/*.zip
            release-artifacts/local-asr/*.json
            release-artifacts/local-asr/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
