name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without a leading v
        required: true
        default: 1.0.0
        type: string
      include_local_asr:
        description: Build the separate Local ASR model bundle
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  package:
    name: Build unsigned validation artifacts
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            AirType.LocalAsrWorker/pyproject.toml
            AirType.LocalAsrWorker/requirements-runtime.txt

      - name: Validate version input
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:AIRTYPE_RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must use x.y.z format.'
          }

      - name: Install worker test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e ".\AirType.LocalAsrWorker[dev]"

      - name: Validate source snapshot
        shell: pwsh
        run: .\tools\build-public-snapshot.ps1

      - name: Build unsigned application candidate
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: .\tools\build-release.ps1 -Version $env:AIRTYPE_RELEASE_VERSION

      - name: Build Local ASR bundle
        if: ${{ inputs.include_local_asr }}
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: .\tools\package-local-asr-bundle.ps1 -Version $env:AIRTYPE_RELEASE_VERSION -PrepareRuntime -Force

      - name: Summarize candidate
        shell: pwsh
        env:
          AIRTYPE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $manifest = Get-Content ".\release-artifacts\app\staging\AirType-$env:AIRTYPE_RELEASE_VERSION-win-x64\release-manifest.json" -Raw -ErrorAction SilentlyContinue
          "## AirType $env:AIRTYPE_RELEASE_VERSION validation candidate" >> $env:GITHUB_STEP_SUMMARY
          "Unsigned: yes" >> $env:GITHUB_STEP_SUMMARY
          "Published as GitHub Release: no" >> $env:GITHUB_STEP_SUMMARY
          if ($manifest) { 'Release manifest generated before deterministic archive cleanup.' >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload application candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirType-${{ inputs.version }}-win-x64-unsigned
          path: |
            release-artifacts/app/AirType-${{ inputs.version }}-win-x64-unsigned.zip
            release-artifacts/app/AirType-${{ inputs.version }}-win-x64-unsigned.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Local ASR candidate
        if: ${{ inputs.include_local_asr }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirType-${{ inputs.version }}-local-asr
          path: |
            release-artifacts/local-asr/*.zip
            release-artifacts/local-asr/*.json
            release-artifacts/local-asr/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
